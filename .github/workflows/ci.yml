name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: for f in install.sh docs/demo/*.sh; do sh -n "$f"; done
      - run: python3 -m py_compile docs/demo/bin/agent
      - run: node -e "for (const f of ['keys.json', 'mods/bar/mod.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
